<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <!-- Decorative left star -->
  <g transform="translate(14,30)" fill="#f59e0b">
    <path d="M0,-9 L2,-2 L9,-2 L3.5,2 L5.5,9 L0,5.5 L-5.5,9 L-3.5,2 L-9,-2 L-2,-2 Z"/>
  </g>

  <!-- PIONEER lettering -->
  <text x="160" y="43" text-anchor="middle"
        fill="url(#wm-gradient)"
        font-family="Georgia,'Times New Roman',serif"
        font-size="36" font-weight="bold" letter-spacing="10">PIONEER</text>

  <!-- Decorative right star -->
  <g transform="translate(306,30)" fill="#f59e0b">
    <path d="M0,-9 L2,-2 L9,-2 L3.5,2 L5.5,9 L0,5.5 L-5.5,9 L-3.5,2 L-9,-2 L-2,-2 Z"/>
  </g>

  <!-- Underline rule -->
  <line x1="26" y1="50" x2="294" y2="50" stroke="#d97706" stroke-width="1.2" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="160" y="59" text-anchor="middle"
        fill="#92400e"
        font-family="Georgia,'Times New Roman',serif"
        font-size="8" letter-spacing="4">AGE  OF  EXPLORATION</text>

  <defs>
    <linearGradient id="wm-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
