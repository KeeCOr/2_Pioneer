<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <circle cx="100" cy="100" r="98" fill="#0d1f35"/>
  <!-- Outer rings -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#92400e" stroke-width="0.8" stroke-dasharray="4,8"/>

  <!-- Cardinal compass points (N/S/E/W) -->
  <g transform="translate(100,100)" fill="#f59e0b">
    <path d="M-5,-22 L0,-83 L5,-22 L0,-10 Z"/>
    <path d="M22,-5 L83,0 L22,5 L10,0 Z"/>
  </g>
  <g transform="translate(100,100)" fill="#b45309">
    <path d="M-5,22 L0,83 L5,22 L0,10 Z"/>
    <path d="M-22,-5 L-83,0 L-22,5 L-10,0 Z"/>
  </g>

  <!-- Intercardinal points (NE/NW/SE/SW) via rotation -->
  <g transform="translate(100,100) rotate(45)">
    <path d="M-3.5,-18 L0,-65 L3.5,-18 L0,-10 Z" fill="#f59e0b" opacity="0.70"/>
    <path d="M18,-3.5 L65,0 L18,3.5 L10,0 Z" fill="#f59e0b" opacity="0.70"/>
    <path d="M-3.5,18 L0,65 L3.5,18 L0,10 Z" fill="#b45309" opacity="0.55"/>
    <path d="M-18,-3.5 L-65,0 L-18,3.5 L-10,0 Z" fill="#b45309" opacity="0.55"/>
  </g>

  <!-- N indicator -->
  <text x="100" y="12" text-anchor="middle" fill="#f59e0b" font-size="9"
        font-family="Georgia,'Times New Roman',serif" font-weight="bold" letter-spacing="1">N</text>

  <!-- Inner medallion -->
  <circle cx="100" cy="100" r="31" fill="#0a1628"/>
  <circle cx="100" cy="100" r="29" fill="none" stroke="#d97706" stroke-width="1.2"/>

  <!-- Sailing ship -->
  <g transform="translate(100,100)" fill="#f59e0b">
    <!-- Hull -->
    <path d="M-21,11 Q0,21 21,11 L19,17 Q0,26 -19,17 Z"/>
    <!-- Mast -->
    <rect x="-1" y="-23" width="2" height="36"/>
    <!-- Main sail (starboard) -->
    <path d="M1,-21 L21,-2 L1,11 Z" opacity="0.90"/>
    <!-- Fore sail (port) -->
    <path d="M-1,-15 L-17,0 L-1,9 Z" opacity="0.60"/>
    <!-- Bowsprit -->
    <line x1="-1" y1="2" x2="-17" y2="-7" stroke="#f59e0b" stroke-width="1.3"/>
    <!-- Flag -->
    <path d="M0,-23 L9,-19 L0,-15 Z" fill="#ef4444"/>
  </g>

  <!-- Pivot -->
  <circle cx="100" cy="100" r="3.5" fill="#d97706"/>
  <circle cx="100" cy="100" r="1.8" fill="#0a1628"/>
</svg>
